<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>auth-recovery-test</title>
</head>
<body>
  <p>IndexedDB minimal probe on a BRAND-NEW db (firebaseLocalStorageDb is not touched; no Firebase, no app JS)</p>
  <pre id="out"></pre>
  <script>
    var el = document.getElementById("out");
    var out = function (s) { el.textContent += s + "\n"; };

    out("NEWDB_OPEN_START");
    var req = indexedDB.open("footchron-idb-probe-20260921", 1);
    req.onerror = function () { out("NEWDB_OPEN_ERROR " + req.error); };
    req.onblocked = function () { out("NEWDB_BLOCKED"); };
    req.onupgradeneeded = function () {
      out("NEWDB_UPGRADE");
      try {
        req.result.createObjectStore("test", { keyPath: "key" });
      } catch (e) {
        out("NEWDB_UPGRADE_ERR " + e);
      }
    };
    req.onsuccess = function () {
      out("NEWDB_OPEN_OK");
      var db = req.result;
      try {
        out("NEWDB_TX_START");
        var tx = db.transaction("test", "readwrite");
        tx.oncomplete = function () { out("NEWDB_TX_COMPLETE"); };
        tx.onerror = function () { out("NEWDB_TX_ERROR " + tx.error); };
        tx.onabort = function () { out("NEWDB_TX_ABORT " + tx.error); };
        out("NEWDB_PUT_START");
        var p = tx.objectStore("test").put({
          key: "probe",
          value: { ok: true }
        });
        p.onsuccess = function () { out("NEWDB_PUT_SUCCESS"); };
        p.onerror = function () { out("NEWDB_PUT_ERROR " + p.error); };
      } catch (e) {
        out("THROW " + e);
      }
    };
  </script>
</body>
</html>
