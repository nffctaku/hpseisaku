<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>auth-recovery</title>
</head>
<body>
  <p>firebaseLocalStorageDb リカバリー（この端末の破損した認証永続化DBだけを削除します。ユーザーデータには触れません）</p>
  <pre id="out"></pre>
  <p>
    <a href="/login" style="font-size:18px;font-weight:bold;">/login へ進む</a>
  </p>
  <p style="font-size:12px;color:#666;">
    DELETE_BLOCKED が出た場合: footchron.com を開いている他のタブをすべて閉じてから、このページを再読み込みしてください。
  </p>
  <script>
    var el = document.getElementById("out");
    var out = function (s) { el.textContent += s + "\n"; };

    out("DELETE_START");
    var req = indexedDB.deleteDatabase("firebaseLocalStorageDb");
    req.onsuccess = function () { out("DELETE_SUCCESS"); };
    req.onblocked = function () { out("DELETE_BLOCKED"); };
    req.onerror = function () { out("DELETE_ERROR " + req.error); };
  </script>
</body>
</html>
